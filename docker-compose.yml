services:
  postgres:
    image: postgres:16
    container_name: rec-dataset-postgres
    environment:
      POSTGRES_DB: rec_dataset_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rec_dataset_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rec_dataset_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  rec_dataset_postgres_data:
